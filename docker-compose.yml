services:
  mlflow:
    build: .
    image: mlp-recommender:latest
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p /mlflow/artifacts
        exec mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:////mlflow/mlflow.db \
          --serve-artifacts \
          --artifacts-destination file:///mlflow/artifacts \
          --allowed-hosts '*' \
          --cors-allowed-origins '*'
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"

  train:
    build: .
    image: mlp-recommender:latest
    command:
      - sh
      - -c
      - |
        git config --global --add safe.directory /app
        dvc repro
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      GIT_CONFIG_GLOBAL: "/tmp/gitconfig"
    volumes:
      - ./.git:/app/.git:ro
      - ./params.yaml:/app/params.yaml:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      - mlflow

volumes:
  mlflow-data: